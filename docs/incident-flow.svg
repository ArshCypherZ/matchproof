<text x="350" y="510" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">Our algorithm</text>
<text x="350" y="527" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">nine checks: amount, currency, order,</text>
<text x="350" y="542" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">timing, duplicates, authenticity...</text>
<rect x="300" y="620" width="360" height="106" rx="10" fill="#fbf8f1" stroke="#181715" stroke-width="2"/>
<text x="320" y="663" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">The gate</text>
<text x="320" y="680" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">is the fix provable on the facts pulled?</text>
<text x="320" y="695" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">captures, refunds, payouts: always blocked</text>
<rect x="100" y="790" width="290" height="90" rx="10" fill="#fbf8f1" stroke="#cec7ba" stroke-width="1.2"/>
<text x="120" y="833" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">Order updated to paid</text>
<text x="120" y="850" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">runs once, cannot double-apply</text>
<rect x="100" y="940" width="290" height="90" rx="10" fill="#fbf8f1" stroke="#cec7ba" stroke-width="1.2"/>
<text x="120" y="983" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">Both records re-read</text>
<text x="120" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">provider and merchant must agree</text>
<rect x="100" y="1090" width="290" height="100" rx="10" fill="#181715" stroke="#181715" stroke-width="1.2"/>
<text x="120" y="1130" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#f2eee5">Closed and verified</text>
<text x="120" y="1147" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#cfc9bd">37 of 100</text>
<text x="120" y="1162" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#cfc9bd">zero wrong fixes</text>
<rect x="580" y="790" width="300" height="100" rx="10" fill="#f3dfc4" stroke="#824c0b" stroke-width="1.2"/>
<text x="600" y="830" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#5c3608">Exception queue</text>
<text x="600" y="847" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5c3608">63 of 100, each with evidence,</text>
<text x="600" y="862" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5c3608">an owner, and a reason</text>
<rect x="580" y="940" width="300" height="100" rx="10" fill="#c9dcff" stroke="#4f70ee" stroke-width="1.2"/>
<text x="600" y="980" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#18213d">AI advisor, read-only</text>
<text x="600" y="997" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#33406e">names the missing fact,</text>
<text x="600" y="1012" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#33406e">5 calls for the whole batch</text>
<rect x="580" y="1090" width="300" height="100" rx="10" fill="#e8e1d5" stroke="#b5a88f" stroke-width="1.4"/>
<g transform="translate(600, 1127)"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M18.665 21.978C16.758 23.255 14.465 24 12 24 5.377 24 0 18.623 0 12S5.377 0 12 0s12 5.377 12 12c0 3.583-1.574 6.801-4.067 9.001L9.219 7.2H7.2v9.596h1.615V9.251l9.85 12.727Zm-3.332-8.533 1.6 2.061V7.2h-1.6v6.245Z" fill="#181715"/></svg></g>
<text x="630" y="1130" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">Operator review</text>
<text x="630" y="1147" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">in the dashboard: exceptions,</text>
<text x="630" y="1162" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">batches, metrics</text>
