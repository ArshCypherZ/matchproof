<rect x="556.8003041385036" y="742" width="105" height="16" rx="3" fill="#f2eee5"/>
<text x="609.3003041385036" y="754" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57534a">cannot prove it</text>
