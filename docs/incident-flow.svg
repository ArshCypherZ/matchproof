<path d="M 245 1030 L 245 1090" fill="none" stroke="#625f59" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="198.7" y="1040" width="92.60000000000001" height="16" rx="3" fill="#f2eee5"/>
<text x="245" y="1052" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57534a">records agree</text>
<path d="M 390 985 L 490 985 L 490 865 L 580 840" fill="none" stroke="#625f59" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="446.8" y="908.2961457693265" width="86.4" height="16" rx="3" fill="#f2eee5"/>
<text x="490" y="920.2961457693265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57534a">still broken</text>
