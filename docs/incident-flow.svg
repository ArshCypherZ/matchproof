<text x="380" y="113" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">Customer pays</text>
<text x="380" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">at Razorpay, money leaves</text>
<text x="380" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">their account</text>
<rect x="330" y="210" width="300" height="86" rx="10" fill="#fbf8f1" stroke="#cec7ba" stroke-width="1.2"/>
<text x="350" y="251" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">The order stays unpaid</text>
<text x="350" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">webhook lost, late, or conflicting</text>
<rect x="330" y="340" width="300" height="86" rx="10" fill="#fbf8f1" stroke="#cec7ba" stroke-width="1.2"/>
<text x="350" y="381" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#181715">Pull both records</text>
<text x="350" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534a">the payment and the merchant order</text>
<rect x="300" y="470" width="360" height="100" rx="10" fill="#fbf8f1" stroke="#181715" stroke-width="2"/>
