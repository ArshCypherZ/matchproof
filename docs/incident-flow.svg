<path d="M 730 1040 L 730 1090" fill="none" stroke="#625f59" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="668.2" y="1045" width="123.60000000000001" height="16" rx="3" fill="#f2eee5"/>
<text x="730" y="1057" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57534a">what to check next</text>
