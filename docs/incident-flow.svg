<rect width="960" height="1310" fill="#f2eee5"/>
<text x="36" y="46" font-size="21" font-weight="bold" fill="#181715">Matchproof</text>
<text x="159" y="46" font-size="21" fill="#57534a">one incident, end to end</text>
