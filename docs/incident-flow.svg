<rect x="241.30892501536164" y="742" width="92.60000000000001" height="16" rx="3" fill="#f2eee5"/>
<text x="287.60892501536165" y="754" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57534a">yes, provable</text>
