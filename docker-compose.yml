services:
  redis:
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "9997:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident_commander
    ports:
      - "9998:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_commander"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3101:3000"
    environment:
      - DATABASE_URL=postgres://incident:incident@postgres:5432/incident_commander
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
