       that proves it. Fixed palette — the printed-artifact rule. -->
  <rect width="512" height="512" rx="112" fill="#181715" />
  <g transform="translate(18.65, 14.2) scale(0.93)">
    <rect x="32" y="152" width="192" height="72" fill="#fbf8f1" />
    <rect x="32" y="296" width="192" height="72" fill="#fbf8f1" />
    <path
      d="M296 252 L352 328 L444 190"
      stroke="#e74432"
      stroke-width="68"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
