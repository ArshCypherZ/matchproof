<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid chip so the mark reads on light and dark tab bars alike;
       no prefers-color-scheme (favicon renderers do not reliably honor it).
       The mark: the accountant's double rule that closes a settled total,
       with the controller's red proof tick between. Fixed palette — the
       printed-artifact rule. -->
  <rect width="512" height="512" rx="112" fill="#181715" />
  <g transform="translate(48, 48) scale(13)">
    <line x1="2.5" y1="4.5" x2="29.5" y2="4.5" stroke="#fbf8f1" stroke-width="3.4" stroke-linecap="round" />
    <line x1="2.5" y1="27.5" x2="29.5" y2="27.5" stroke="#fbf8f1" stroke-width="3.4" stroke-linecap="round" />
    <path
      d="M10 16.7 L14.8 21.5 L22.8 11.5"
      stroke="#e74432"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
